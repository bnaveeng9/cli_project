[project]
name = "cli-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.3.0",
    "asyncio>=4.0.0",
    "claude>=0.4.11",
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "mcp-client>=0.0.0",
    "mcp[cli]>=1.8.0,<2.0.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "stdio>=1.0.1",
]

[project.scripts]
cli-project = "cli_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
